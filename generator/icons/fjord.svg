<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Fjord">
    <title>Fjord</title>
    <!-- Sky -->
    <rect width="100" height="100" rx="12" fill="#0E2A38"/>
    <!-- Far cliff, right -->
    <path d="M100 30 L100 74 L58 74 L74 44 Z" fill="#2E5C6E"/>
    <!-- Near cliff, left -->
    <path d="M0 22 L30 40 L44 74 L0 74 Z" fill="#3E7A8C"/>
    <!-- The water between them: the whole point of a fjord -->
    <rect x="0" y="74" width="100" height="26" fill="#5BC0BE"/>
    <!-- A wake heading out through the narrows -->
    <path d="M18 84 h26 M52 90 h30 M30 95 h22" stroke="#0E2A38" stroke-width="3" stroke-linecap="round" opacity=".45"/>
</svg>
