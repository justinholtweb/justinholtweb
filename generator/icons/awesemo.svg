<?xml version="1.0" encoding="UTF-8"?>
<!--
  Plugin Store icon. Rounded tile in the plugin's accent, mark in #FEFEFE — the shape the rest of
  the family uses, so a row of these in the Plugin Store reads as one shelf.

  The mark is A.W.E.S.O.M.-O 4000: a robot made of cardboard boxes, carrying the three things that
  actually identify him — a fake speaker, the name written across the chest, and a blinking red
  light. Head box narrower than the torso box, one antenna, tube arms, and a strip of tape across
  the bottom flap.

  Eyes, mouth, speaker, lettering and tape are the tile showing through rather than a second ink,
  so the whole mark is one white mass plus one red dot and cannot turn to mud at 32px.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Awesemo">
  <!-- Rounded tile: 22.44% radius, matching Appleseed's rx="35" on a 156px square -->
  <rect x="0" y="0" width="100" height="100" rx="22.44" fill="#4C7DDA"/>

  <!-- Antenna and arms. Nonzero, because the ball and the stem overlap on purpose. -->
  <path fill="#FEFEFE" d="
    M55,9 A5,5 0 1 1 45,9 A5,5 0 1 1 55,9 Z
    M47.25,9 H52.75 V19 H47.25 Z
    M11,60 H12 A4,4 0 0 1 16,64 V80 A4,4 0 0 1 12,84 H11 A4,4 0 0 1 7,80 V64 A4,4 0 0 1 11,60 Z
    M88,60 H89 A4,4 0 0 1 93,64 V80 A4,4 0 0 1 89,84 H88 A4,4 0 0 1 84,80 V64 A4,4 0 0 1 88,60 Z
  "/>

  <!-- Head: box, two round eyes, a slatted mouth. The slats are a third crossing, so they fill. -->
  <path fill="#FEFEFE" fill-rule="evenodd" d="
    M30,19 H70 A5,5 0 0 1 75,24 V44 A5,5 0 0 1 70,49 H30 A5,5 0 0 1 25,44 V24 A5,5 0 0 1 30,19 Z
    M45,30 A5.5,5.5 0 1 1 34,30 A5.5,5.5 0 1 1 45,30 Z
    M66,30 A5.5,5.5 0 1 1 55,30 A5.5,5.5 0 1 1 66,30 Z
    M33,39.5 H67 V45.5 H33 Z
    M39.5,39.5 H42.7 V45.5 H39.5 Z
    M48.4,39.5 H51.6 V45.5 H48.4 Z
    M57.3,39.5 H60.5 V45.5 H57.3 Z
  "/>

  <!-- Chest: speaker and cone, two bars of lettering, the hole the light sits in, and the tape. -->
  <path fill="#FEFEFE" fill-rule="evenodd" d="
    M22,55 H78 A5,5 0 0 1 83,60 V87 A5,5 0 0 1 78,92 H22 A5,5 0 0 1 17,87 V60 A5,5 0 0 1 22,55 Z
    M41.5,70 A7.5,7.5 0 1 1 26.5,70 A7.5,7.5 0 1 1 41.5,70 Z
    M36.7,70 A2.7,2.7 0 1 1 31.3,70 A2.7,2.7 0 1 1 36.7,70 Z
    M49,64 H77 V68.5 H49 Z
    M49,72 H67 V76.5 H49 Z
    M77.6,74 A3.6,3.6 0 1 1 70.4,74 A3.6,3.6 0 1 1 77.6,74 Z
    M25,83 H75 V87 H25 Z
  "/>

  <!-- The blinking red light. The one place a third ink earns its keep. -->
  <circle cx="74" cy="74" r="3.6" fill="#E8443A"/>
</svg>
