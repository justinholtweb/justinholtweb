<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Archie">
  <!--
  Plugin Store icon. Rounded tile in the plugin's accent, mark in #FEFEFE — the shape the rest of
  the family uses, so a row of these in the Plugin Store reads as one shelf. Tile radius 22.44%,
  matching Appleseed's rx="35" on a 156px square.

  Traced from src/icon.jpg. The tile is a real rounded rect at the family's radius rather than a
  traced approximation of one, so it stays crisp at any size and the corners match its siblings
  exactly. Everything inside is one path with fill-rule="evenodd": the head is the outer contour,
  the line work is holes in it, and the crosshatch cells are islands inside those holes — which
  even-odd resolves on its own, with no second colour anywhere in the mark.
  -->
