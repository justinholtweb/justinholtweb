<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Rounded tile: 22.44% radius, the family's app-icon shape.
       Self-coloured on purpose — this file is the Plugin Store icon and the marketing-site
       logo, where there is no `currentColor` to inherit. The control panel nav uses
       icon-mask.svg instead, which is the monochrome silhouette. -->
  <rect x="0" y="0" width="100" height="100" rx="22.44" fill="#8E2F5B"/>
  <g fill="none" stroke="#FEFEFE" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Screen -->
    <rect x="14" y="18" width="72" height="52" rx="7"/>
    <!-- Stand -->
    <path d="M50 70v10"/>
    <path d="M36 80h28"/>
    <!-- A click, and what it radiates: the ripple a heatmap is made of -->
    <path d="M46 56a14 14 0 0 1 14-14"/>
    <path d="M34 56a26 26 0 0 1 26-26"/>
  </g>
  <circle cx="60" cy="56" r="5.5" fill="#FEFEFE"/>
</svg>
