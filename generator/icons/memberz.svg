<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Memberz">
  <!-- A membership card with a person on it: the account area, not "a group of people".
       Three overlapping heads is what every membership plugin uses and none of them read at 32px. -->
  <rect width="100" height="100" rx="22" fill="#2F6F4F"/>
  <rect x="16" y="26" width="68" height="48" rx="7" fill="#FCFEFB"/>
  <!-- The portrait. Clipped by the card's own rounded rect so the shoulders end at the card edge. -->
  <clipPath id="m-card"><rect x="16" y="26" width="68" height="48" rx="7"/></clipPath>
  <g clip-path="url(#m-card)">
    <circle cx="37" cy="43" r="9" fill="#2F6F4F"/>
    <path d="M37 55c-10 0-18 6-18 14v9h36v-9c0-8-8-14-18-14z" fill="#2F6F4F"/>
  </g>
  <!-- The detail lines. Two, not four: at 32px more become a grey smear. -->
  <rect x="56" y="40" width="20" height="5" rx="2.5" fill="#2F6F4F"/>
  <rect x="56" y="51" width="14" height="5" rx="2.5" fill="#9CC4AF"/>
</svg>
