<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Plugin Store icon. Rounded tile in the plugin's accent, mark in #FEFEFE — the shape the
       rest of the family uses, so a row of these in the Plugin Store reads as one shelf. -->
  <rect x="0" y="0" width="100" height="100" rx="22.44" fill="#2F5DE0"/>
  <!-- A pair of pants. Two legs, one waist, one seam down the middle: the plugin's whole job is
       sending a field down the side leg instead of the main one, and the pun is the point.
       Everything inside the silhouette is cut out in the tile colour rather than drawn in a
       second ink, so the mark stays monochrome at every size. -->
  <path d="M30 17 H70 L73 86 H55.4 L50 51 L44.6 86 H27 Z" fill="#FEFEFE"/>
  <g fill="#2F5DE0">
    <rect x="29.7" y="25" width="40.6" height="3.3"/>
    <rect x="48.6" y="28.8" width="2.8" height="16"/>
  </g>
  <g fill="none" stroke="#2F5DE0" stroke-width="2.7" stroke-linecap="round">
    <path d="M41.2 29.4 C 37.6 33.4 34.6 36.2 30.6 38.6"/>
    <path d="M58.8 29.4 C 62.4 33.4 65.4 36.2 69.4 38.6"/>
  </g>
</svg>
