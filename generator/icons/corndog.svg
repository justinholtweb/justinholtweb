<?xml version="1.0" encoding="UTF-8"?>
<!--
  Plugin Store icon. Rounded tile in the plugin's accent, mark in #FEFEFE — the shape the rest of
  the family uses, so a row of these in the Plugin Store reads as one shelf.

  The mark is a corn dog held at an angle: a long fried body, a stick out of the bottom, and a
  zigzag of mustard down it. The drizzle is punched out of the body with fill-rule="evenodd"
  rather than drawn in a second colour — it is the tile showing through, so the whole mark stays
  one white mass and cannot turn to mud at 32px.

  Two drafts got thrown away getting here, and both failures are worth keeping:

  - Three straight parallel ridges across a short capsule read as a **honey dipper**. Parallel
    stripes on a round body are a roller, not food.
  - One big three-segment zigzag on that same capsule read as a literal letter **Z** on a paddle.
    A drizzle has to be tight and repeated — six short zigs at low amplitude — or the eye files it
    as type.

  The body's proportions do most of the work: 28 wide by 58 tall is a sausage. At the 1:1.4 of the
  first draft it was a lollipop whatever was drawn on it.

  The stick is a separate element on purpose. Under evenodd, two overlapping subpaths of one path
  cancel each other out, so a stick drawn inside the body path would punch a notch through it
  exactly where it enters. Separate elements simply union.

  The group transform tilts the mark and shrinks it to the margin the family's other icons carry.
  The drizzle keeps ~7 units of clearance from the body outline, so the white never pinches shut
  around it at small sizes.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Corndog">
  <!-- Rounded tile: 22.44% radius, matching the rest of the family -->
  <rect x="0" y="0" width="100" height="100" rx="22.44" fill="#D98B2B"/>

  <g transform="rotate(-20 50 50) translate(50 50) scale(0.82) translate(-50 -50)">
    <!-- Stick -->
    <rect x="47.25" y="62" width="5.5" height="28" rx="2.75" fill="#FEFEFE"/>

    <!-- The fried body, with the mustard zigzag punched out of it -->
    <path fill="#FEFEFE" fill-rule="evenodd" d="
      M50,10 A14,14 0 0 1 64,24 V54 A14,14 0 0 1 50,68 A14,14 0 0 1 36,54 V24 A14,14 0 0 1 50,10 Z
      M44.95,22.20 L51.57,28.00 L43.57,35.00 L51.57,42.00 L43.57,49.00 L52.95,57.20 L55.05,54.80
      L48.43,49.00 L56.43,42.00 L48.43,35.00 L56.43,28.00 L47.05,19.80 Z
    "/>
  </g>
</svg>
