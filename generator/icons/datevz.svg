<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Rounded tile: 22.44% radius, matching the rest of the family -->
  <rect x="0" y="0" width="100" height="100" rx="22.44" fill="#1F6379"/>
  <g fill="#FEFEFE">
    <!-- A T-account: the shape every bookkeeper reads before they read the words.
         Soll on the left of the rule, Haben on the right. -->
    <rect x="17" y="28" width="66" height="5" rx="1.5"/>
    <rect x="47.5" y="28" width="5" height="54" rx="1.5"/>
    <!-- Soll: three postings, ragged like real figures -->
    <rect x="23" y="43" width="19" height="4" rx="2"/>
    <rect x="23" y="55" width="14" height="4" rx="2"/>
    <rect x="23" y="67" width="17" height="4" rx="2"/>
    <!-- Haben: two -->
    <rect x="58" y="43" width="17" height="4" rx="2"/>
    <rect x="58" y="55" width="12" height="4" rx="2"/>
  </g>
</svg>
