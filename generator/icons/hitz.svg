<!--
  Plugin Store icon. Rounded tile in the plugin's accent, mark in #FEFEFE — the family's shape.

  The mark is a hall plan: the hall's walls, four stands in two rows either side of an aisle, and
  one stand that has been *hit* — hollow, with a dot in it. One path with fill-rule="evenodd", so
  the walls' interior and the hit stand are holes rather than a second colour, and
  src/icon-mask.svg is the same path unchanged.

  Green #3A9A1E sits at ~106° — clear of Speculatr's olive (#4D7C0F, ~85°) and the family's
  sea-greens (#0F8A5F, #5FB084, ~145–158°).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Hitz">
  <rect x="0" y="0" width="100" height="100" rx="22.44" fill="#3A9A1E"/>
  <path fill="#FEFEFE" fill-rule="evenodd" d="M26,16 H74 A10,10 0 0 1 84,26 V74 A10,10 0 0 1 74,84 H26 A10,10 0 0 1 16,74 V26 A10,10 0 0 1 26,16 Z M28,23 A5,5 0 0 0 23,28 V72 A5,5 0 0 0 28,77 H72 A5,5 0 0 0 77,72 V28 A5,5 0 0 0 72,23 Z M30,30 H47 V44 H30 Z M53,30 H70 V44 H53 Z M30,56 H47 V70 H30 Z M53,56 H70 V70 H53 Z M56,59 V67 H67 V59 Z M61.5,59.8 A3.2,3.2 0 1 0 61.5,66.2 A3.2,3.2 0 1 0 61.5,59.8 Z"/>
</svg>
