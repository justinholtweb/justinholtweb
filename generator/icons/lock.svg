<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Lock">
    <title>Lock</title>
    <!--
        A padlock in outline on a warm tile, with a key and an export folder tucked into the body
        beside the keyhole. The three marks are the three things a data subject can ask for: the
        lock is the data, the key is the access, the folder with the arrow is the copy they are
        entitled to walk away with.

        Traced from src/icon.jpg. Geometry is the measured artwork scaled to a 512 box: the tile's
        14–580px bounds in the source map to 0–512 here, so every radius and stroke below is a real
        measurement rather than an eyeballed redraw. The key and folder carry a 3.2/3.0 stroke
        against the lock's 10.5 on purpose — they are annotations on the padlock, not siblings of
        it, and matching the weights flattens the hierarchy the original drawing has.
    -->
    <defs>
        <linearGradient id="lock-tile" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#D89260"/>
            <stop offset="1" stop-color="#81502C"/>
        </linearGradient>
    </defs>

    <rect width="512" height="512" rx="107" fill="url(#lock-tile)"/>

    <g fill="none" stroke="#FFFCEF" stroke-linejoin="round">
        <!--
            Shackle. Two concentric stroked arches rather than one thick band: the artwork is line
            work throughout, and a filled shackle would be the only solid mass in the drawing. The
            legs run to y=226, which is under the body's top stroke (219–229.5), so the joint is
            covered rather than butted — the body is drawn after this group for that reason.
        -->
        <g stroke-width="10.5" stroke-linecap="butt">
            <path d="M163.4 226 V184.5 a92.6 92.6 0 0 1 185.2 0 V226"/>
            <path d="M197.3 226 V184.5 a58.7 58.7 0 0 1 117.4 0 V226"/>
        </g>

        <!-- Body. -->
        <rect x="133.2" y="224.3" width="245.6" height="198.1" rx="25.3" stroke-width="10.5"/>

        <!--
            Keyhole. Circle, a waist just below it, then a flare to a flat foot — the classic
            warded shape. Drawn as one closed path so the circle and the tail share a stroke and
            there is no seam where they meet.
        -->
        <path stroke-width="10.8" d="
            M240.2 325.7
            a27.1 27.1 0 1 1 31.6 0
            C270.0 336 272.5 355 275.9 371.8
            H236.1
            C239.5 355 242.0 336 240.2 325.7
            Z"/>

        <!--
            Key. The bow and the shaft are one outline, joined where the shaft's edges meet the
            bow's circle (y=283.9 at ±6.3 from the axis), which is how the source draws it — a
            circle laid over a bar shows its own bottom edge crossing the shaft and reads as two
            overlapping objects instead of one key. The bit is a shallow 1.3-unit sawtooth: it
            disappears into the stroke below about 48px, which is the same thing the original does.
        -->
        <g stroke-width="3.2">
            <path d="
                M325.1 283.9
                a15.6 15.6 0 1 1 12.6 0
                V299.2
                L336.2 303.2 L338.9 307.2 L336.2 311.6 L338.9 316.0 L336.0 320.4
                C335.2 323.6 333.6 325.6 331.4 325.7
                C329.1 325.6 327.4 323.4 326.4 319.8
                L325.1 313.5
                Z"/>
            <circle cx="331.4" cy="265.9" r="3.5"/>
        </g>

        <!--
            Folder with a download arrow. The tab, the body, and a flap line that starts inset from
            the left edge and runs to the right — the inset is in the source and it is what stops
            the flap reading as a divider across a rectangle.
        -->
        <g stroke-width="3" stroke-linecap="round">
            <path d="
                M295.3 392.6
                V344.6 a4.5 4.5 0 0 1 4.5-4.5
                H316.0
                L322.3 346.9
                H353.5 a4.5 4.5 0 0 1 4.5 4.5
                V388.1 a4.5 4.5 0 0 1 -4.5 4.5
                H299.8 a4.5 4.5 0 0 1 -4.5-4.5
                Z"/>
            <path d="M309.7 354.1 H358.0"/>
            <path d="M326.4 364.6 V383.5"/>
            <path d="M319.7 375.9 L326.4 383.5 L333.2 375.9"/>
        </g>
    </g>
</svg>
