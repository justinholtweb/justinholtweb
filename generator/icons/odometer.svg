<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Plugin Store icon. Rounded tile in the plugin's accent, mark in #FEFEFE — the shape the
       rest of the family uses, so a row of these in the Plugin Store reads as one shelf. -->
  <rect x="0" y="0" width="100" height="100" rx="22.44" fill="#4A55C8"/>
  <!-- A gate of five: four uprights and the stroke laid across them. It is the oldest counting
       notation there is, it is what the plugin does, and it is legible at any size — which a bar
       chart, the obvious alternative, stops being at about 20px. The diagonal runs low-left to
       high-right so the group reads left to right the way it is written by hand. -->
  <g fill="none" stroke="#FEFEFE" stroke-width="7.5" stroke-linecap="round">
    <path d="M31 30V70"/>
    <path d="M43 30V70"/>
    <path d="M55 30V70"/>
    <path d="M67 30V70"/>
    <path d="M24 72 76 28"/>
  </g>
</svg>
