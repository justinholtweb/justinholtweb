<?xml version="1.0" encoding="UTF-8"?>
<!--
  Plugin Store icon. Rounded tile in the plugin's accent, mark in #FEFEFE — the family's shape.

  The mark is a speech bubble with a code comment's two slashes cut out of it: a note, in the
  language developers write notes in. One path with fill-rule="evenodd", so the slashes are holes
  rather than a second colour, and src/icon-mask.svg is the same path unchanged.

  Orchid #9B3DB8 sits at ~286° — the one hue gap in the family, between Airwave's violet and
  Toss's magenta.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Xplain">
  <rect x="0" y="0" width="100" height="100" rx="22.44" fill="#9B3DB8"/>
  <path fill="#FEFEFE" fill-rule="evenodd" d="M30,22 H70 A12,12 0 0 1 82,34 V56 A12,12 0 0 1 70,68 H47 L30,83 L33,68 H30 A12,12 0 0 1 18,56 V34 A12,12 0 0 1 30,22 Z M34.5,57 L42.5,57 L52.5,33 L44.5,33 Z M47.5,57 L55.5,57 L65.5,33 L57.5,33 Z"/>
</svg>
