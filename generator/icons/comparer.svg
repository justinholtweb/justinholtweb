<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Rounded tile: 22.44% radius, the family's app-icon shape -->
  <rect x="0" y="0" width="100" height="100" rx="22.44" fill="#2F6F9E"/>
  <g fill="#FEFEFE">
    <!-- Two panels side by side: the comparison itself -->
    <path d="M14 16h32v6H14zM14 16h6v68h-6zM40 16h6v68h-6zM14 78h32v6H14z"/>
    <path d="M54 16h32v6H54zM54 16h6v68h-6zM80 16h6v68h-6zM54 78h32v6H54z"/>

    <!-- Rows. The pairs deliberately disagree: a comparison that matched on every
         row would be a list, not a comparison. -->
    <rect x="24" y="32" width="18" height="5" rx="2.5"/>
    <rect x="64" y="32" width="18" height="5" rx="2.5"/>

    <rect x="24" y="47" width="18" height="5" rx="2.5" opacity=".38"/>
    <rect x="64" y="47" width="10" height="5" rx="2.5"/>

    <rect x="24" y="62" width="10" height="5" rx="2.5"/>
    <rect x="64" y="62" width="18" height="5" rx="2.5" opacity=".38"/>
  </g>
</svg>
